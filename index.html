<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IMPRESIVE 首頁主視覺比較與即時調色工具">
  <title>IMPRESIVE — 主視覺實驗室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23203c37'/%3E%3Cpath d='M12 12h16v16H12z' fill='none' stroke='%23b7dbc9' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="studio-i18n.css">
</head>
<body id="top">
  <header class="studio-header">
    <a class="studio-brand" href="#top" aria-label="IMPRESIVE 主視覺實驗室首頁">
      <svg class="studio-mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="currentColor"/><path d="M10 12h11v14H10zM16 8h10v14H16z" fill="none" stroke="#c4e0ce" stroke-width="1.5"/></svg>
      <span><strong>IMPRESIVE</strong><span class="brand-divider">/</span><span>主視覺實驗室</span></span>
    </a>
    <div class="header-actions"><span class="local-badge"><i></i>本機設計工作台</span><span id="saveStatus" class="save-status" role="status">設定會自動保留</span>
      <div class="language-switch" role="group" aria-label="介面語言">
        <button type="button" data-language="zh-Hant" lang="zh-Hant" aria-pressed="true">中文</button>
        <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
      </div>
      <details class="export-menu" id="exportMenu"><summary class="button button-dark">匯出設計 <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg></summary><div class="export-options">
        <button type="button" id="downloadHtml">下載 B 版 HTML<span>含字型與圖像，可離線開啟</span></button>
        <button type="button" id="copyCss">複製 B 版 CSS 變數<span>保留目前色彩與版面參數</span></button>
        <button type="button" id="downloadJson">下載 A/B 設定 JSON</button>
        <button type="button" id="importJson">載入設定 JSON</button>
      </div></details>
    </div>
  </header>
  <main class="workbench">
    <aside class="controls" aria-label="主視覺調整控制台">
      <section class="preset-section">
        <div class="section-title"><h1>從一個方向開始</h1><span>4 個提案</span></div>
        <p class="section-description">選範本，再把它調成你想要的樣子。</p>
        <div id="presetList" class="preset-list" aria-label="設計範本"></div>
      </section>
      <div class="custom-title"><h2>調整 B 版</h2><span id="customBadge">範本設定</span></div>
      <details class="control-section" open><summary>色彩調色盤<span>5 色</span></summary><div id="colorControls" class="color-controls"></div></details>
      <details class="control-section" open><summary>漸層與版面<span>拉桿調整</span></summary><div id="rangeControls" class="range-controls"></div></details>
      <div class="switch-row"><label for="animateLogo">標誌動畫</label><input id="animateLogo" type="checkbox" role="switch"><span class="switch-visual" aria-hidden="true"></span></div>
      <div id="contrastStatus" class="contrast-status" role="status"></div>
      <div class="controls-footer"><button id="resetPreset" type="button" class="button button-outline">還原此範本</button><p>調整只影響比較頁，原網站維持原樣。</p></div>
    </aside>
    <section class="preview-workspace" aria-label="設計預覽與比較">
      <div class="preview-heading"><div><div class="preview-label">即時預覽 <span id="modifiedDot" hidden>已自訂</span></div><h2 id="currentName">清透藍綠</h2></div><div class="device-toggle" role="group" aria-label="預覽裝置"><button type="button" data-device="desktop" aria-pressed="true"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="16" height="11" rx="1.5"/><path d="M7 18h6M10 14v4"/></svg>桌面</button><button type="button" data-device="mobile" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="1.5" width="10" height="17" rx="2"/><path d="M9 15.5h2"/></svg>手機</button></div></div>
      <div class="preview-toolbar"><div class="view-toggle" role="group" aria-label="比較模式"><button type="button" data-mode="single" aria-pressed="true">單一預覽</button><button type="button" data-mode="side" aria-pressed="false">左右比較</button><button type="button" data-mode="wipe" aria-pressed="false">拉桿比較</button></div><span id="canvasSize">1440 × 900</span></div>
      <div class="reference-bar"><label for="referencePreset"><strong>A</strong> 比較基準</label><select id="referencePreset" aria-label="A 版比較基準"><option value="original">原版重建</option><option value="refined">清透藍綠</option><option value="editorial">暖白編輯式</option><option value="navy">深海藍</option><option value="snapshot" hidden>已固定的自訂版本</option></select><button type="button" id="pinReference">將目前 B 版設為 A <span aria-hidden="true">↗</span></button></div>
      <div class="canvas-area" id="canvasArea"><div id="stage" class="stage" data-mode="single" data-device="desktop">
        <div class="preview-pane pane-a"><div class="pane-caption"><span class="version-label">A</span><strong id="referenceName">原版重建</strong><span>比較基準</span></div><div class="frame-shell" id="shellA"><iframe id="frameA" title="A 版：固定比較基準" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></div></div>
        <div class="preview-pane pane-b"><div class="pane-caption"><span class="version-label">B</span><strong id="versionName">清透藍綠</strong><span>即時調整</span></div><div class="frame-shell" id="shellB"><iframe id="frameB" title="B 版：目前調整中的主視覺" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></div></div>
        <div class="wipe-control" id="wipeControl" hidden><div class="wipe-line"><span><svg viewBox="0 0 32 20" aria-hidden="true"><path d="m10 5-5 5 5 5m12-10 5 5-5 5M16 3v14"/></svg></span></div><input type="range" min="0" max="100" value="50" id="wipeRange" aria-label="拖曳調整 A/B 比較分界" aria-valuetext="左側 A 版 50%，右側 B 版 50%"></div>
      </div></div>
      <div class="preview-footnote"><p id="previewHint">右側預覽會跟著設定即時更新。切換「拉桿比較」，可與 A 版直接對照。</p><button type="button" id="openPreview">另開純預覽 <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 3h6v6M17 3l-9 9M8 4H3v13h13v-5"/></svg></button></div>
      <div class="direction-note"><span class="note-dot"></span><div><strong id="directionTitle">建議從這一版開始</strong><p id="directionDescription">以更輕的背景襯托品牌藍綠，縮小內文，讓標題與網絡標誌各自有清楚的位置。</p></div></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <noscript><p class="noscript">請啟用 JavaScript 以使用即時調色與比較功能。</p></noscript>
  <script src="assets.js"></script>
  <script src="hero-preview.js"></script>
  <script src="studio-i18n.js"></script>
  <script src="studio.js"></script>
</body>
</html>
